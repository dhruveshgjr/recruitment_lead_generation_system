[project]
name = "hiringleads"
version = "1.0.0"
description = "Production-grade public hiring signal intelligence for agency recruiters"
requires-python = ">=3.11"
dependencies = [
  "httpx[http2]>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "jinja2>=3.1,<4",
  "aiosmtplib>=5,<6",
  "apscheduler>=3.11,<4",
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "typer>=0.16,<1",
  "rich>=14,<15",
  "rapidfuzz>=3.14,<4",
  "python-dateutil>=2.9,<3",
  "tenacity>=9,<10",
  "structlog>=25,<26",
  "orjson>=3.11,<4",
  "prometheus-client>=0.23,<1",
  "alembic>=1.16,<2",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.13,<1",
]

[project.scripts]
hl = "hiringleads.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiringleads"]

[tool.hatch.build.targets.wheel.force-include]
"src/hiringleads/delivery/templates" = "hiringleads/delivery/templates"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
